name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.8"
          - os: macos-latest
            python-version: "3.8"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest suite
        run: pytest -v

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions with twine
        run: twine check dist/*

      - name: Verify CLI in clean virtual environment
        shell: bash
        run: |
          VENV_DIR="$RUNNER_TEMP/tyzombie-venv"
          rm -rf "$VENV_DIR"
          python -m venv "$VENV_DIR"
          if [ -f "$VENV_DIR/Scripts/python.exe" ]; then
            PY="$VENV_DIR/Scripts/python.exe"
            CLI="$VENV_DIR/Scripts/tyzombie.exe"
          else
            PY="$VENV_DIR/bin/python"
            CLI="$VENV_DIR/bin/tyzombie"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl
          "$CLI" --version
          "$CLI" --help > /dev/null
          "$PY" -m tyzombie --version
